<svg class="tdc-svg tdc-bar-chart-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="세그먼트 상승">
  <defs>
    <filter id="tdc-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="tdc-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tdc-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
  </defs>

  <rect width="1280" height="720" fill="#f3f4f6"/>
  <rect x="76" y="74" width="1128" height="572" rx="28" fill="#ffffff" filter="url(#tdc-shadow)"/>
  <text x="126" y="142" fill="#1e3a8a" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="52" font-weight="760">세그먼트 상승</text>
  <text x="126" y="190" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24">Rising percent bars with disciplined chart spacing</text>
  <line x1="220" y1="560" x2="1052" y2="560" stroke="#e5e7eb" stroke-width="4"/>
  <line x1="220" y1="464" x2="1052" y2="464" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="220" y1="370" x2="1052" y2="370" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="220" y1="274" x2="1052" y2="274" stroke="#e5e7eb" stroke-width="2"/>
  <rect data-role="bar" x="260" y="420.33" width="116" height="139.67" rx="24" fill="#dbeafe"/>
  <text x="318.0" y="398.33" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="31" font-weight="800">42%</text>
  <text x="318.0" y="594" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23" font-weight="700">인지</text>
  <rect data-role="bar" x="430" y="367.12" width="116" height="192.88" rx="24" fill="#bfdbfe"/>
  <text x="488.0" y="345.12" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="31" font-weight="800">58%</text>
  <text x="488.0" y="594" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23" font-weight="700">관심</text>
  <rect data-role="bar" x="600" y="323.88" width="116" height="236.12" rx="24" fill="#60a5fa"/>
  <text x="658.0" y="301.88" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="31" font-weight="800">71%</text>
  <text x="658.0" y="594" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23" font-weight="700">시범</text>
  <rect data-role="bar" x="770" y="274.00" width="116" height="286.00" rx="24" fill="#d97706"/>
  <text x="828.0" y="252.00" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="31" font-weight="800">86%</text>
  <text x="828.0" y="594" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23" font-weight="700">유지</text>
  <rect x="980" y="114" width="134" height="48" rx="24" fill="#e2e8f0"/>
  <text x="1047" y="147" text-anchor="middle" fill="#0f172a" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="22" font-weight="800">SVG DATA</text>

</svg>