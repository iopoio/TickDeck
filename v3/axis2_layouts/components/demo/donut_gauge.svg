<svg class="tdc-svg tdc-donut-gauge-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="신뢰 전환">
  <defs>
    <filter id="tdc-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="tdc-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tdc-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <rect x="80" y="82" width="1120" height="556" rx="38" fill="#f8fafc" filter="url(#tdc-shadow)"/>
  <circle cx="438" cy="360" r="198" fill="#ffffff"/>
  <circle cx="438" cy="360" r="172" fill="none" stroke="#dbeafe" stroke-width="46"/>
  <path data-role="donut-arc" d="M 438.00 188.00 A 172 172 0 1 1 282.36 286.79" fill="none" stroke="url(#tdc-purple)" stroke-width="46" stroke-linecap="round"/>
  <circle cx="438" cy="360" r="104" fill="#f8fafc"/>
  <text x="438" y="348" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="92" font-weight="820">82%</text>
  <text x="438" y="404" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="25" font-weight="700">conversion gauge</text>
  <rect x="728" y="154" width="330" height="72" rx="22" fill="url(#tdc-green)"/>
  <text x="760" y="201" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="30" font-weight="800">신뢰 전환</text>
  <text x="728" y="300" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="58" font-weight="780">Signal strength</text>
  <text x="728" y="356" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="26">근거 단계까지 도달한 비율</text>
  <line x1="728" y1="430" x2="1060" y2="430" stroke="#e5e7eb" stroke-width="3"/>
  <circle cx="776" cy="500" r="17" fill="#334155"/>
  <text data-role="donut-legend-line" x="812" y="509" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="700">Clean sales palette</text>
  <circle cx="776" cy="552" r="17" fill="#2563eb"/>
  <text data-role="donut-legend-line" x="812" y="561" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="700">Three-part gauge pattern</text>

</svg>