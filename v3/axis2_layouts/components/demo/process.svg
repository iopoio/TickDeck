<svg class="tdc-svg tdc-process-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="근거 프로세스">
  <defs>
    <filter id="tdc-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="tdc-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="tdc-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="tdc-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="tdc-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="116" y="132" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="58" font-weight="780">근거 프로세스</text>
  <text x="116" y="176" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23">Vivid arrows with sequential structure</text>
  <rect x="90" y="206" width="1100" height="298" rx="32" fill="#f8fafc"/>
  <polygon data-role="process-step" points="116.00,230.00 360.00,230.00 402.00,288.00 360.00,346.00 116.00,346.00 158.00,288.00" fill="#dbeafe"/>
  <text x="259.00" y="282" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="860">구상</text>
  <text x="259.00" y="314" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="700">주장 찾기</text>
  <text x="172" y="424" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="38" font-weight="840">50%</text>
  <text x="172" y="456" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="800">step 01</text>
  <polygon data-role="process-step" points="384.00,230.00 628.00,230.00 670.00,288.00 628.00,346.00 384.00,346.00 426.00,288.00" fill="#bfdbfe"/>
  <text x="527.00" y="282" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="860">개발</text>
  <text x="527.00" y="314" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="700">근거 만들기</text>
  <text x="440" y="424" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="38" font-weight="840">75%</text>
  <text x="440" y="456" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="800">step 02</text>
  <polygon data-role="process-step" points="652.00,230.00 896.00,230.00 938.00,288.00 896.00,346.00 652.00,346.00 694.00,288.00" fill="#60a5fa"/>
  <text x="795.00" y="282" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="860">확장</text>
  <text x="795.00" y="314" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="700">스토리 묶기</text>
  <text x="708" y="424" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="38" font-weight="840">60%</text>
  <text x="708" y="456" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="800">step 03</text>
  <polygon data-role="process-step" points="920.00,230.00 1164.00,230.00 1206.00,288.00 1164.00,346.00 920.00,346.00 962.00,288.00" fill="#d97706"/>
  <text x="1063.00" y="282" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="860">위임</text>
  <text x="1063.00" y="314" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="700">운영 넘김</text>
  <text x="976" y="424" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="38" font-weight="840">65%</text>
  <text x="976" y="456" text-anchor="middle" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="800">step 04</text>
  <line data-role="process-connector" x1="384.00" y1="288.00" x2="402.00" y2="288.00" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line data-role="process-connector" x1="652.00" y1="288.00" x2="670.00" y2="288.00" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line data-role="process-connector" x1="920.00" y1="288.00" x2="938.00" y2="288.00" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="174" cy="586" r="22" fill="#dbeafe"/>
  <circle cx="230" cy="586" r="22" fill="#bfdbfe"/>
  <circle cx="286" cy="586" r="22" fill="#60a5fa"/>
  <circle cx="342" cy="586" r="22" fill="#d97706"/>
  <text x="398" y="594" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="22" font-weight="800">Real polygon arrows with four measured steps.</text>

</svg>