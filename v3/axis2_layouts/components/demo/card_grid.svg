  <circle data-role="card-spark-marker" data-value="64.0" cx="398" cy="477.44" r="11" fill="#dbeafe" stroke="#ffffff" stroke-width="4"/>
  <rect data-role="card-progress-track" x="168" y="526" width="244" height="18" rx="9" fill="#ccfbf1"/>
