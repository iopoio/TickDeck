  <path data-role="card-spark" d="M 528 512 L 754 469.88" data-value="78.0" fill="none" stroke="#1e40af" stroke-width="10" stroke-linecap="round"/>
  <circle data-role="card-spark-marker" data-value="78.0" cx="754" cy="469.88" r="11" fill="#bfdbfe" stroke="#ffffff" stroke-width="4"/>
  <rect data-role="card-progress-track" x="524" y="526" width="244" height="18" rx="9" fill="#ccfbf1"/>
  <rect x="524" y="526" width="190.32" height="18" rx="9" fill="#bfdbfe"/>

  <rect data-role="card-frame" x="842" y="256" width="320" height="318" rx="28" fill="#ffffff" filter="url(#tdc-shadow)"/>
  <rect x="870" y="284" width="58" height="58" rx="18" fill="#d97706"/>
  <text x="899" y="323" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23" font-weight="840">03</text>
  <text x="870" y="388" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="35" font-weight="800">실행</text>
  <text x="870" y="430" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23">영업 리듬</text>
  <text data-role="card-value" x="1124" y="456" text-anchor="end" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="32" font-weight="820">55%</text>
