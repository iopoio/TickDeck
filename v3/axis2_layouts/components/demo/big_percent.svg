<svg class="tdc-svg tdc-big-percent-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="시장 준비">
  <defs>
    <filter id="tdc-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="tdc-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tdc-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
  </defs>

  <rect width="1280" height="720" rx="0" fill="#f8fafc"/>
  <rect x="88" y="78" width="1104" height="564" rx="34" fill="#ffffff" filter="url(#tdc-shadow)"/>
  <rect x="88" y="78" width="392" height="564" rx="34" fill="url(#tdc-purple)"/>
  <text x="132" y="160" fill="#dbeafe" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="28" font-weight="700">BIG PERCENT</text>
  <text x="132" y="358" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="143" font-weight="800">73%</text>
  <text x="132" y="430" fill="#dbeafe" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="32" font-weight="700">시장 준비</text>
  <text data-role="caption-line" x="132" y="486" fill="#dbeafe" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="400">핵심 수치 검산 완료</text>
  <line x1="548" y1="176" x2="1128" y2="176" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="548" y1="290" x2="1128" y2="290" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="548" y1="404" x2="1128" y2="404" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="548" y="488" width="680" height="34" rx="17" fill="#e2e8f0"/>
  <rect data-role="progress-fill" x="548" y="488" width="496.40" height="34" rx="17" fill="url(#tdc-green)"/>
  <text x="548" y="126" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="46" font-weight="760">Evidence-weighted signal</text>
  <text x="548" y="228" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="26">Target threshold</text>
  <text x="1128" y="228" text-anchor="end" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="42" font-weight="800">70%</text>
  <text x="548" y="342" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="26">Current measure</text>
  <text x="1128" y="342" text-anchor="end" fill="#1e3a8a" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="42" font-weight="800">73%</text>
  <text x="548" y="582" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="22">Big-number signal with financial gauge structure</text>

</svg>