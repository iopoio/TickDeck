<svg class="tdc-svg tdc-map-data-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="지역 수요">
  <defs>
    <filter id="tdc-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="tdc-purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tdc-green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="tdc-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tdc-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    
  </defs>

  <rect width="1280" height="720" fill="#071525"/>
  <text x="92" y="112" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="52" font-weight="780">지역 수요</text>
  <text x="92" y="154" fill="#e2e8f0" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="23">Map cards with regional data tone</text>
  <rect x="86" y="226" width="278" height="314" rx="24" fill="#f8fafc"/>
  <g data-role="map-legend">
    <circle cx="138" cy="302" r="20" fill="url(#tdc-orange)"/>
