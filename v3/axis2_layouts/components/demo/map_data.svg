  <rect x="396" y="174" width="744" height="416" rx="28" fill="#f1f5f9"/>
  <path data-role="map-region" d="M 424 278 C 492 226, 588 218, 654 260 C 620 302, 548 326, 458 326 Z" fill="#d8dee8" stroke="#f8fafc" stroke-width="8"/>
  <path data-role="map-region" d="M 630 280 C 704 228, 820 226, 906 274 C 854 328, 736 346, 648 322 Z" fill="#d8dee8" stroke="#f8fafc" stroke-width="8"/>
