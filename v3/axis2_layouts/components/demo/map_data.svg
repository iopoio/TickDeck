    <text x="178" y="296" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="820">서부</text>
    <text x="178" y="322" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18">Demand score</text>
    <circle cx="138" cy="378" r="20" fill="url(#tdc-purple)"/>
