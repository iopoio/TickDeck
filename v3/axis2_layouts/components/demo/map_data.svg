  <text x="456.56" y="318.00" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="21" font-weight="840">52%</text>
  <circle data-role="map-bubble" cx="610.00" cy="370.00" r="33.48" fill="url(#tdc-purple)" opacity="0.94"/>
  <text x="610.00" y="378.00" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="21" font-weight="840">41%</text>
  <circle data-role="map-bubble" cx="860.00" cy="275.00" r="39.92" fill="url(#tdc-teal)" opacity="0.94"/>
  <text x="860.00" y="283.00" text-anchor="middle" fill="#ffffff" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="21" font-weight="840">64%</text>
  <rect x="868" y="514" width="224" height="44" rx="22" fill="#ffffff" opacity="0.92"/>
  <text x="980" y="543" text-anchor="middle" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18" font-weight="820">SVG map geometry</text>

