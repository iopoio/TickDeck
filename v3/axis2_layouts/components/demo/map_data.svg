    <text x="178" y="372" fill="#111827" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="24" font-weight="820">중부</text>
    <text x="178" y="398" fill="#64748b" font-family="'Malgun Gothic', NanumGothic, Pretendard, sans-serif" font-size="18">Demand score</text>
    <circle cx="138" cy="454" r="20" fill="url(#tdc-teal)"/>
